<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">__init__.py 是包的钥匙</title>
  <desc id="desc">小黑把 __init__.py 钥匙插进目录门，目录变成可以 import 的包。</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 250 h420 c36 0 66 30 66 66 v360 c0 36 -30 66 -66 66 H190 c-36 0 -66 -30 -66 -66 V316 c0 -36 30 -66 66 -66z"/>
    <path d="M126 340 h550"/>
    <path d="M190 250 l70 -72 h210 l70 72"/>
    <path d="M300 432 h210 v250 H300z"/>
    <path d="M510 432 c54 34 56 216 0 250"/>
    <circle cx="470" cy="560" r="12"/>
    <path d="M965 300 h310 c38 0 70 32 70 70 v310 c0 38 -32 70 -70 70 H965 c-38 0 -70 -32 -70 -70 V370 c0 -38 32 -70 70 -70z"/>
    <path d="M965 300 l58 -64 h188 l64 64"/>
    <path d="M895 390 h450"/>
    <path d="M1014 444 h205 v240 h-205z"/>
    <path d="M1219 444 c46 44 48 194 0 240"/>
    <circle cx="1180" cy="562" r="12"/>
    <path d="M715 548 C772 520 816 518 878 542"/>
  </g>
  <g>
    <path d="M742 513 c-42 -6 -75 20 -82 60 c-8 42 18 80 60 88 c43 8 82 -16 90 -58 c9 -45 -21 -84 -68 -90z" fill="#111"/>
    <circle cx="725" cy="572" r="8" fill="#fff"/>
    <circle cx="760" cy="572" r="8" fill="#fff"/>
    <path d="M713 661 c-16 36 -18 58 -9 76" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M776 660 c17 30 25 54 19 77" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M807 570 l95 -10" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M902 560 l32 -25 l30 22 l-28 24 z" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <path d="M936 581 l0 25" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#111">
    <text x="250" y="205" font-size="36">普通目录</text>
    <text x="1012" y="214" font-size="36">Python 包</text>
    <text x="672" y="470" font-size="30">__init__.py</text>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" fill="#d13b2f">
    <text x="206" y="790">没有钥匙：不能当包进门</text>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" fill="#2670b8">
    <text x="976" y="790">有入口：可以 import</text>
  </g>
  <g fill="none" stroke="#f08a24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M615 705 C730 785 920 795 1040 710"/>
    <path d="M1040 710 l-42 2"/>
    <path d="M1040 710 l-18 34"/>
  </g>
</svg>

