  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="27" fill="#2670b8">
    <text x="1085" y="660">像真实用户一样 import</text>
  </g>
  <g fill="none" stroke="#f08a24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
