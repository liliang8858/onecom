<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">editable install 是一根活线</title>
  <desc id="desc">小黑把 src 代码和测试台用一根活线接起来，修改源码后测试立刻看到变化。</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 320 h420 c40 0 70 30 70 70 v250 c0 40 -30 70 -70 70H215c-40 0 -70 -30 -70 -70V390c0 -40 30 -70 70 -70z"/>
    <path d="M235 420 h330"/>
    <path d="M235 505 h250"/>
    <path d="M235 590 h305"/>
    <path d="M980 310 h405 c40 0 70 30 70 70v270c0 40 -30 70 -70 70H980c-40 0 -70 -30 -70 -70V380c0 -40 30 -70 70 -70z"/>
    <path d="M1025 415 h255"/>
    <path d="M1025 505 h310"/>
    <path d="M1025 595 h230"/>
    <path d="M705 520 C780 455 840 455 910 520"/>
    <path d="M705 585 C795 670 835 670 910 585"/>
  </g>
  <g>
    <path d="M742 505 c-42 -5 -78 24 -84 66 c-7 46 22 84 66 91 c45 6 83 -21 90 -66 c7 -45 -24 -85 -72 -91z" fill="#111"/>
    <circle cx="725" cy="568" r="8" fill="#fff"/>
    <circle cx="764" cy="568" r="8" fill="#fff"/>
    <path d="M718 662 c-16 38 -16 62 -6 86" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M780 660 c18 34 25 62 18 88" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M704 545 C660 520 622 512 580 515" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
    <path d="M814 550 C855 528 890 520 935 522" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#f08a24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M595 760 C760 830 970 822 1120 748"/>
    <path d="M1120 748 l-43 -3"/>
    <path d="M1120 748 l-18 39"/>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#111">
    <text x="310" y="270" font-size="38">src 源码</text>
    <text x="1058" y="260" font-size="38">测试台</text>
    <text x="640" y="438" font-size="32">-e 活连接</text>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" fill="#2670b8">
    <text x="585" y="850">改一行，测试马上看见</text>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" fill="#d13b2f">
    <text x="224" y="765">不用反复重装</text>
  </g>
</svg>
