<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf7ff" />
    <title>Health Agent UI v2 Industrial H5</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ecg-bg" aria-hidden="true"></div>
    <main class="page-shell">
      <header class="brand-header">
        <div class="brand-left">
          <img class="app-icon" src="./assets/brand_app_icon.png" alt="Health Agent 图标" />
          <div class="brand-copy">
            <h1>Health Agent with ECG Intelligence</h1>
            <p>基于 Apple Health + ECG 的智能健康 Agent，理解你的数据，发现关键变化，并给出下一步建议。</p>
          </div>
        </div>
        <div class="trust-row" aria-label="核心原则">
          <div class="trust-pill"><span>盾</span><strong>隐私优先</strong><em>数据端到端加密</em></div>
          <div class="trust-pill"><span>针</span><strong>本地优先</strong><em>优先在设备端处理</em></div>
          <div class="trust-pill"><span>星</span><strong>AI 洞察 · 非诊断</strong><em>提供洞察，不替代医生</em></div>
        </div>
      </header>

      <section class="hero-strip">
        <img src="./assets/mascot_hero_wave.png" alt="小智健康助手" />
        <div class="speech">
          <strong>Hi，我是小智</strong>
          <span>我会用你授权的数据，把复杂健康变化变成清楚的问题、解释和建议。</span>
        </div>
      </section>

      <nav id="sceneTabs" class="scene-tabs" aria-label="UI v2 场景"></nav>
      <section id="sceneRoot" class="scene-root"></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
