<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf5ff" />
    <title>Health Agent UI001 首页专题复刻</title>
    <link rel="stylesheet" href="./ui001.css?v=20260508-2" />
  </head>
  <body>
    <main class="stage-wrap" aria-label="Health Agent UI001 首页专题复刻">
      <section class="ui001-stage">
        <div class="mesh mesh-left"></div>
        <div class="mesh mesh-right"></div>
        <div class="ecg-line top-line"></div>
        <div class="sparkles s1"></div>
        <div class="sparkles s2"></div>

        <header class="brand-area">
          <div class="brand-mark">
            <img src="./assets/brand_heart_logo.png" alt="Health Agent 心电图标" />
          </div>
          <div class="brand-copy">
            <h1>Health Agent with ECG Intelligence</h1>
            <p>基于 Apple Health + ECG 的智能健康洞察 Agent，理解你的数据，发现值得关注的事，给出可行动建议。</p>
          </div>
        </header>

        <div class="assistant-hero">
          <img src="./assets/mascot_hero_wave.png" alt="小智健康助手" />
        </div>
        <div class="speech-card">
          <strong>Hi~ 我是小小智 💙</strong>
          <span>你的健康洞察小助手，随时为你发现关键变化，陪你一起变得更好！</span>
        </div>

        <section class="trust-card trust-privacy">
          <span class="trust-icon shield-icon"></span>
          <strong>隐私优先</strong>
          <em>数据端到端加密</em>
        </section>
        <section class="trust-card trust-local">
          <span class="trust-icon pin-icon"></span>
          <strong>本地优先</strong>
          <em>在设备端处理为先</em>
        </section>
        <section class="trust-card trust-ai">
          <span class="trust-icon star-icon"></span>
          <strong>AI 洞察 · 非诊断</strong>
          <em>提供洞察，不替代医生</em>
        </section>

        <section id="phoneRow" class="phone-row"></section>

        <section class="bottom-values">
          <div><span class="value-bars"></span>理解数据</div>
          <b>·</b>
          <div><span class="value-bulb"></span>发现关键</div>
          <b>·</b>
          <div><span class="value-check"></span>给出建议</div>
          <b>·</b>
          <div><span class="value-heart"></span>助你更好地照顾自己</div>
          <small>Designed for Health&nbsp;&nbsp;·&nbsp;&nbsp;Built with Privacy</small>
        </section>
      </section>
    </main>
    <script src="./ui001.js?v=20260508-4"></script>
  </body>
</html>
